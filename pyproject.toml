[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "abc-geometry-recovery"
version = "0.1.0"
description = "Provenance-preserving FK recovery for missing ABC-130K end-effector geometry"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Aryan Sawhney" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcap>=1.2.2",
  "mcap-protobuf-support>=0.5.3",
  "mujoco>=3.3.0",
  "numpy>=1.26",
  "pyarrow>=18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
abc-geometry = "abc_geometry.cli:main"

[project.urls]
Homepage = "https://sawhney17.github.io/abc-geometry-recovery/"
Repository = "https://github.com/sawhney17/abc-geometry-recovery"
Issues = "https://github.com/sawhney17/abc-geometry-recovery/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/abc_geometry"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/demo",
  "/evidence",
  "/scripts",
  "/CITATION.cff",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

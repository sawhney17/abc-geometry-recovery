<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABC public robot-data recovery result</title>
  <desc id="desc">314,081 missing end-effector poses recovered from valid joint telemetry across eight of forty public episodes, with a separate nineteen centimetre calibration-cohort error prevented.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#10192b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48a8ff"/>
      <stop offset="1" stop-color="#79d2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1510" cy="-20" r="330" fill="#1479d4" opacity="0.12"/>
  <circle cx="40" cy="890" r="270" fill="#26b7a3" opacity="0.08"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="92" y="82" fill="#7acbff" font-size="24" font-weight="600" letter-spacing="4">PUBLIC ABC-130K DATA AUDIT</text>
    <text x="92" y="171" fill="#f4f8ff" font-size="66" font-weight="700">314,081 missing robot poses.</text>
    <text x="92" y="241" fill="url(#accent)" font-size="66" font-weight="700">Recovered without guessing.</text>
    <text x="95" y="292" fill="#aebbd0" font-size="25">Every affected row kept six valid joints. Ambiguous shared-frame calibration was refused.</text>

    <g transform="translate(92 354)" filter="url(#shadow)">
      <rect width="438" height="360" rx="26" fill="#111e31" stroke="#263a55"/>
      <text x="30" y="48" fill="#8fa1ba" font-size="19" letter-spacing="2">MISSINGNESS</text>
      <text x="30" y="96" fill="#f4f8ff" font-size="37" font-weight="700">8 of 40 episodes</text>
      <text x="30" y="128" fill="#9eacc1" font-size="18">all four arm-pose streams empty</text>

      <g transform="translate(30 164)">
        <g fill="#ff735c">
          <rect x="0" y="0" width="31" height="31" rx="6"/><rect x="40" y="0" width="31" height="31" rx="6"/>
          <rect x="80" y="0" width="31" height="31" rx="6"/><rect x="120" y="0" width="31" height="31" rx="6"/>
          <rect x="160" y="0" width="31" height="31" rx="6"/><rect x="200" y="0" width="31" height="31" rx="6"/>
          <rect x="240" y="0" width="31" height="31" rx="6"/><rect x="280" y="0" width="31" height="31" rx="6"/>
        </g>
        <g fill="#32445e">
          <rect x="320" y="0" width="31" height="31" rx="6"/><rect x="360" y="0" width="31" height="31" rx="6"/>
          <rect x="0" y="40" width="31" height="31" rx="6"/><rect x="40" y="40" width="31" height="31" rx="6"/>
          <rect x="80" y="40" width="31" height="31" rx="6"/><rect x="120" y="40" width="31" height="31" rx="6"/>
          <rect x="160" y="40" width="31" height="31" rx="6"/><rect x="200" y="40" width="31" height="31" rx="6"/>
          <rect x="240" y="40" width="31" height="31" rx="6"/><rect x="280" y="40" width="31" height="31" rx="6"/>
          <rect x="320" y="40" width="31" height="31" rx="6"/><rect x="360" y="40" width="31" height="31" rx="6"/>
          <rect x="0" y="80" width="31" height="31" rx="6"/><rect x="40" y="80" width="31" height="31" rx="6"/>
          <rect x="80" y="80" width="31" height="31" rx="6"/><rect x="120" y="80" width="31" height="31" rx="6"/>
          <rect x="160" y="80" width="31" height="31" rx="6"/><rect x="200" y="80" width="31" height="31" rx="6"/>
          <rect x="240" y="80" width="31" height="31" rx="6"/><rect x="280" y="80" width="31" height="31" rx="6"/>
          <rect x="320" y="80" width="31" height="31" rx="6"/><rect x="360" y="80" width="31" height="31" rx="6"/>
          <rect x="0" y="120" width="31" height="31" rx="6"/><rect x="40" y="120" width="31" height="31" rx="6"/>
          <rect x="80" y="120" width="31" height="31" rx="6"/><rect x="120" y="120" width="31" height="31" rx="6"/>
          <rect x="160" y="120" width="31" height="31" rx="6"/><rect x="200" y="120" width="31" height="31" rx="6"/>
          <rect x="240" y="120" width="31" height="31" rx="6"/><rect x="280" y="120" width="31" height="31" rx="6"/>
          <rect x="320" y="120" width="31" height="31" rx="6"/><rect x="360" y="120" width="31" height="31" rx="6"/>
        </g>
      </g>
      <circle cx="35" cy="339" r="6" fill="#ff735c"/><text x="50" y="345" fill="#9eacc1" font-size="17">all poses empty</text>
      <circle cx="211" cy="339" r="6" fill="#32445e"/><text x="226" y="345" fill="#9eacc1" font-size="17">all poses intact</text>
    </g>

    <g transform="translate(557 354)" filter="url(#shadow)">
      <rect width="468" height="360" rx="26" fill="#111e31" stroke="#263a55"/>
      <text x="30" y="48" fill="#8fa1ba" font-size="19" letter-spacing="2">DETERMINISTIC REPAIR</text>
      <rect x="30" y="78" width="164" height="66" rx="14" fill="#172940" stroke="#385373"/>
      <text x="50" y="105" fill="#8fa1ba" font-size="15">RAW MESSAGE</text>
      <text x="50" y="130" fill="#ff907d" font-family="ui-monospace, monospace" font-size="20">pose = []</text>
      <path d="M208 111 H254" stroke="#6cbfff" stroke-width="3"/>
      <path d="M246 103 L256 111 L246 119" fill="none" stroke="#6cbfff" stroke-width="3"/>
      <rect x="268" y="78" width="170" height="66" rx="14" fill="#172940" stroke="#385373"/>
      <text x="288" y="105" fill="#8fa1ba" font-size="15">TELEMETRY</text>
      <text x="288" y="130" fill="#8fe0cc" font-family="ui-monospace, monospace" font-size="20">6 finite joints</text>

      <path d="M234 166 V208" stroke="#6cbfff" stroke-width="3"/>
      <path d="M226 200 L234 210 L242 200" fill="none" stroke="#6cbfff" stroke-width="3"/>
      <rect x="96" y="218" width="276" height="64" rx="16" fill="#17314a" stroke="#48a8ff" stroke-width="2"/>
      <text x="142" y="258" fill="#f4f8ff" font-size="23" font-weight="600">pinned YAM FK chain</text>
      <path d="M234 283 V313" stroke="#6cbfff" stroke-width="3"/>
      <path d="M226 305 L234 315 L242 305" fill="none" stroke="#6cbfff" stroke-width="3"/>
      <text x="64" y="345" fill="#7fd6ff" font-family="ui-monospace, monospace" font-size="18">arm_local [x y z qw qx qy qz]</text>
    </g>

    <g transform="translate(1052 354)" filter="url(#shadow)">
      <rect width="456" height="360" rx="26" fill="#111e31" stroke="#263a55"/>
      <text x="30" y="48" fill="#8fa1ba" font-size="19" letter-spacing="2">CALIBRATION TRAP</text>
      <text x="30" y="96" fill="#f4f8ff" font-size="37" font-weight="700">19 cm prevented</text>
      <text x="30" y="128" fill="#9eacc1" font-size="18">two valid right-base cohorts</text>

      <line x1="70" y1="178" x2="392" y2="178" stroke="#2d4058" stroke-width="2"/>
      <circle cx="140" cy="178" r="12" fill="#55b8ff"/>
      <text x="30" y="216" fill="#aebbd0" font-size="18">30 episodes</text>
      <text x="254" y="171" fill="#7fd6ff" font-family="ui-monospace, monospace" font-size="21">-0.61 m</text>

      <line x1="70" y1="268" x2="392" y2="268" stroke="#2d4058" stroke-width="2"/>
      <circle cx="326" cy="268" r="12" fill="#ff735c"/>
      <text x="30" y="306" fill="#aebbd0" font-size="18">2 episodes</text>
      <text x="254" y="261" fill="#ff907d" font-family="ui-monospace, monospace" font-size="21">-0.80 m</text>

      <path d="M140 236 V248 M140 242 H326 M326 236 V248" fill="none" stroke="#ff907d" stroke-width="3"/>
      <rect x="196" y="226" width="74" height="31" rx="15" fill="#3b2530"/>
      <text x="211" y="248" fill="#ffb0a2" font-size="16" font-weight="600">19 cm</text>
    </g>

    <line x1="92" y1="765" x2="1508" y2="765" stroke="#263a55"/>
    <text x="92" y="814" fill="#d8e2f1" font-size="23" font-weight="600">641,593 public arm records audited</text>
    <text x="92" y="850" fill="#8798b0" font-size="18">pinned sources  •  independent field scan  •  immutable sidecar  •  explicit refusal boundary</text>
    <text x="1508" y="830" fill="#7acbff" text-anchor="end" font-size="21" font-weight="600">github.com/sawhney17/abc-geometry-recovery</text>
  </g>
</svg>
